<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- GitHub Pages では COOP/COEP ヘッダーを設定できないため Service Worker で代替 -->
    <script src="%BASE_URL%coi-serviceworker.js"></script>
    <title>Narapy — Python Learning Environment</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Google Fonts: BIZ UDPGothic (UI) + 0xProto (コード) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=0xProto:ital,wght@0,400;0,700;1,400&family=BIZ+UDPGothic:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-canvas text-ink h-screen flex flex-col overflow-hidden font-sans">

    <!-- ヘッダー -->
    <header class="flex items-center justify-between px-3 lg:px-4 py-2.5 gap-2 bg-panel border-b border-line shrink-0">
      <div class="flex items-center gap-2.5 shrink-0">
        <img src="/favicon.svg" alt="Narapy" class="w-7 h-7 select-none shrink-0 hidden sm:block" draggable="false" />
        <span class="text-[15px] font-bold tracking-tight text-ink shrink-0 hidden sm:inline">Narapy</span>
        <span class="text-[11px] font-mono px-1.5 py-0.5 rounded-md text-muted border border-line shrink-0 hidden lg:inline-block">
          Python Learning
        </span>
        <div class="w-px h-4 bg-line mx-1 shrink-0 hidden lg:block"></div>
        <!-- パネル表示トグル -->
        <div class="flex items-center gap-1 shrink-0">
          <button
            id="panelTogglePython"
            class="text-xs px-2 lg:px-2.5 py-1 rounded-md font-medium transition-colors cursor-pointer whitespace-nowrap shrink-0 bg-accent/15 text-accent border border-accent/40"
          >Python</button>
          <button
            id="panelToggleLog"
            class="text-xs px-2 lg:px-2.5 py-1 rounded-md font-medium transition-colors cursor-pointer whitespace-nowrap shrink-0 bg-accent/15 text-accent border border-accent/40"
          >実行</button>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <!-- ハンバーガーメニュー -->
        <div class="relative shrink-0">
          <button
            id="hamburgerMenuBtn"
            title="メニュー"
            aria-label="メニュー"
            aria-haspopup="true"
            aria-expanded="false"
            class="flex items-center justify-center w-8 h-8 rounded-lg text-muted hover:text-ink hover:bg-hover transition-colors cursor-pointer shrink-0"
          >
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
            </svg>
          </button>
          <div
            id="hamburgerMenuDropdown"
            role="menu"
            aria-label="メニュー"
            class="hidden absolute left-0 mt-1 w-44 bg-panel border border-line rounded-lg shadow-xl py-1 z-[100]"
          ></div>
        </div>
        <!-- フォントサイズ制御 -->
        <div class="hidden md:flex items-center gap-0.5 border border-line rounded-lg overflow-hidden mr-1 shrink-0">
          <button
            id="fontDecrease"
            title="文字を小さく"
            class="px-2 py-1.5 text-xs text-muted hover:text-ink hover:bg-hover transition-colors cursor-pointer select-none"
          >A-</button>
          <span id="fontSizeLabel" class="px-1 text-xs font-mono text-muted select-none tabular-nums w-6 text-center">13</span>
          <button
            id="fontIncrease"
            title="文字を大きく"
            class="px-2 py-1.5 text-xs text-muted hover:text-ink hover:bg-hover transition-colors cursor-pointer select-none"
          >A+</button>
        </div>
        <button
          id="importProjectBtn"
          title="プロジェクトを開く（.narapy形式）"
          aria-label="プロジェクトを開く（.narapy形式）"
          class="hidden sm:flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-line text-xs text-muted hover:text-ink hover:bg-hover transition-colors cursor-pointer shrink-0 whitespace-nowrap"
        >
          <svg class="w-3.5 h-3.5 shrink-0" aria-hidden="true" focusable="false" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75z"/>
          </svg>
          <span class="hidden xl:inline">開く</span>
        </button>
        <button
          id="exportProjectBtn"
          title="プロジェクトを保存（.narapy形式）"
          aria-label="プロジェクトを保存（.narapy形式）"
          class="hidden sm:flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-line text-xs text-muted hover:text-ink hover:bg-hover transition-colors cursor-pointer shrink-0 whitespace-nowrap"
        >
          <svg class="w-3.5 h-3.5 shrink-0" aria-hidden="true" focusable="false" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 7.5h1.5m-1.5 3h1.5m-7.5 3h7.5m-7.5 3h7.5m3-9h3.375c.621 0 1.125.504 1.125 1.125V18a2.25 2.25 0 0 1-2.25 2.25M16.5 7.5V18a2.25 2.25 0 0 0 2.25 2.25M16.5 7.5V4.875c0-.621-.504-1.125-1.125-1.125H4.125C3.504 3.75 3 4.254 3 4.875V18a2.25 2.25 0 0 0 2.25 2.25h13.5M6 7.5h3v3H6v-3z"/>
          </svg>
          <span class="hidden xl:inline">保存</span>
        </button>
        <!-- テーマ切替（ボタンは src/theme/index.ts が生成する） -->
        <div
          id="themeSwitcher"
          role="group"
          aria-label="テーマ"
          class="hidden lg:flex items-center gap-0.5 border border-line rounded-lg p-0.5 shrink-0"
        ></div>
        <button
          id="aboutBtn"
          title="オープンソースライセンス"
          aria-label="オープンソースライセンス"
          class="hidden md:flex items-center gap-1.5 px-2 py-1.5 rounded-lg text-xs text-muted hover:text-ink hover:bg-hover transition-colors cursor-pointer shrink-0 whitespace-nowrap"
        >
          <svg class="w-3.5 h-3.5 shrink-0" aria-hidden="true" focusable="false" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
          <span class="hidden xl:inline">ライセンス</span>
        </button>
        <!-- 実行ステータス -->
        <div class="hidden lg:flex items-center gap-1.5 px-1 text-xs font-mono text-muted shrink-0 whitespace-nowrap">
          <span id="runStatusDot" class="w-1.5 h-1.5 rounded-full bg-muted shrink-0"></span>
          <span id="runStatusLabel">待機中</span>
        </div>
        <button
          id="runBtn"
          class="flex items-center gap-2 px-4 py-1.5 rounded-lg whitespace-nowrap shrink-0 text-sm font-bold transition-colors cursor-pointer border bg-accent text-accent-ink border-accent hover:bg-accent-ink hover:text-accent"
        >
          ▶ 実行
        </button>
      </div>
    </header>

    <!-- メインエリア（単一カラム） -->
    <main class="flex flex-1 overflow-hidden relative">

      <!-- 全パネル非表示時のメッセージ -->
      <div id="emptyMessage" class="hidden absolute inset-0 z-10 flex-col items-center justify-center bg-canvas">
        <span class="text-muted text-sm select-none">何もありません</span>
      </div>

      <!-- ファイルエクスプローラー + テキストエディタ + 実行ログ -->
      <section id="rightPanel" class="flex overflow-hidden min-w-0 flex-1">

        <!-- ファイルエクスプローラー -->
        <aside id="fileExplorer" class="flex flex-col w-44 shrink-0 border-r border-line bg-panel"></aside>

        <!-- エディタ + ログ（split.js 縦分割対象） -->
        <div class="flex flex-col flex-1 min-w-0">

          <!-- テキストエディタ -->
          <div id="editorPanel" class="flex flex-col overflow-hidden border-b border-line bg-editor">
            <div id="editorHeader" class="flex items-center justify-between px-4 py-2.5 bg-panel border-b border-line shrink-0">
              <div class="flex items-center gap-2.5 min-w-0">
                <svg class="w-3.5 h-3.5 text-muted shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                  <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
                </svg>
                <span class="text-[11px] font-bold text-muted uppercase tracking-[0.08em] shrink-0 whitespace-nowrap">Python エディタ</span>
                <span id="editorFileName" class="text-[11px] text-muted font-mono truncate">main.py</span>
              </div>
            </div>
            <div id="codeEditor" class="flex-1 w-full min-h-0"></div>
          </div>

          <!-- 実行ログ -->
          <div id="logPanel" class="flex flex-col overflow-hidden bg-panel">
            <div class="flex items-center justify-between px-4 py-2.5 bg-panel border-b border-line shrink-0">
              <div class="flex items-center gap-2.5">
                <svg class="w-3.5 h-3.5 text-muted shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                  <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
                </svg>
                <span class="text-[11px] font-bold text-muted uppercase tracking-[0.08em] shrink-0 whitespace-nowrap">実行ログ</span>
              </div>
              <button
                id="copyLogBtn"
                title="実行結果をクリップボードにコピー"
                class="flex items-center gap-1 text-xs text-muted hover:text-ink transition-colors cursor-pointer"
              >
                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
                コピー
              </button>
            </div>
            <div
              id="outputLog"
              class="flex-1 overflow-y-auto p-4 font-mono text-sm text-code bg-panel leading-relaxed"
            >
              <span data-placeholder="true" data-log-exclude="true" class="text-muted italic">実行結果がここに表示されます…</span>
            </div>
          </div>

        </div><!-- /エディタ + ログ -->
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

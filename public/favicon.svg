<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- 蛇の胴体: N の字を形成 -->
  <path d="M 7 24 L 7 8 L 25 24 L 25 8"
        fill="none"
        stroke="#fbbf24"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- 蛇の頭 (右上) -->
  <circle cx="25" cy="7.5" r="3" fill="#fbbf24"/>
  <!-- 目 -->
  <circle cx="26.2" cy="6.4" r="1" fill="#1c1917"/>
  <circle cx="26.5" cy="6.1" r="0.35" fill="white"/>
  <!-- 二股の舌 -->
  <path d="M 22.8 8.2 L 20.8 8"
        fill="none" stroke="#f87171" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M 20.8 8 L 19.7 7.1 M 20.8 8 L 19.7 8.9"
        fill="none" stroke="#f87171" stroke-width="0.9" stroke-linecap="round"/>

  <!-- 尻尾 (左下でくるっと巻く) -->
  <path d="M 7 24 C 5 27 5.5 30.5 8 30"
        fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round"/>
</svg>

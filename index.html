<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- GitHub Pages では COOP/COEP ヘッダーを設定できないため Service Worker で代替 -->
    <script src="%BASE_URL%coi-serviceworker.js"></script>
    <title>Narapy — Python Learning Environment</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Google Fonts: BIZ UDPGothic (UI) + 0xProto (コード) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=0xProto:ital,wght@0,400;0,700;1,400&family=BIZ+UDPGothic:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-[#08080d] text-slate-100 h-screen flex flex-col overflow-hidden font-sans">

    <!-- ヘッダー -->
    <header class="flex items-center justify-between px-6 py-3 bg-[#110826] border-b border-purple-900/50 shrink-0">
      <div class="flex items-center gap-3">
        <img src="/favicon.svg" alt="Narapy" class="w-8 h-8 select-none" draggable="false" />
        <span class="text-lg font-bold tracking-tight text-purple-100">Narapy</span>
        <span class="text-xs px-2 py-0.5 rounded-full bg-violet-500/20 text-violet-300 border border-violet-500/30">
          Python Learning
        </span>
        <div class="w-px h-4 bg-purple-800/60 mx-1"></div>
        <!-- パネル表示トグル -->
        <div class="flex items-center gap-1">
          <button
            id="panelToggleBlockly"
            class="text-xs px-2.5 py-1 rounded-md font-medium transition-colors cursor-pointer bg-sky-500/15 text-sky-300 border border-sky-600/40"
          >ブロック</button>
          <button
            id="panelTogglePython"
            class="text-xs px-2.5 py-1 rounded-md font-medium transition-colors cursor-pointer bg-violet-500/15 text-violet-300 border border-violet-600/40"
          >Python</button>
          <button
            id="panelToggleLog"
            class="text-xs px-2.5 py-1 rounded-md font-medium transition-colors cursor-pointer bg-emerald-500/15 text-emerald-300 border border-emerald-600/40"
          >実行</button>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <!-- フォントサイズ制御 -->
        <div class="flex items-center gap-0.5 border border-slate-700/60 rounded-lg overflow-hidden mr-1">
          <button
            id="fontDecrease"
            title="文字を小さく"
            class="px-2 py-1.5 text-xs text-slate-400 hover:text-slate-100 hover:bg-slate-700/40 transition-colors cursor-pointer select-none"
          >A-</button>
          <span id="fontSizeLabel" class="px-1 text-xs text-slate-500 select-none tabular-nums w-6 text-center">13</span>
          <button
            id="fontIncrease"
            title="文字を大きく"
            class="px-2 py-1.5 text-xs text-slate-400 hover:text-slate-100 hover:bg-slate-700/40 transition-colors cursor-pointer select-none"
          >A+</button>
        </div>
        <button
          id="uploadBtn"
          title=".pyファイルを開く"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs text-violet-300 hover:text-violet-100 hover:bg-violet-500/20 transition-colors cursor-pointer"
        >
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9.776c.112-.017.227-.026.344-.026h15.812c.117 0 .232.009.344.026m-16.5 0a2.25 2.25 0 0 0-1.883 2.542l.857 6a2.25 2.25 0 0 0 2.227 1.932H19.05a2.25 2.25 0 0 0 2.227-1.932l.857-6a2.25 2.25 0 0 0-1.883-2.542m-16.5 0V6A2.25 2.25 0 0 1 6 3.75h3.879a1.5 1.5 0 0 1 1.06.44l2.122 2.12a1.5 1.5 0 0 0 1.06.44H18A2.25 2.25 0 0 1 20.25 9v.776"/>
          </svg>
          開く
        </button>
        <button
          id="downloadBtn"
          title="Pythonファイルとして保存"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs text-violet-300 hover:text-violet-100 hover:bg-violet-500/20 transition-colors cursor-pointer"
        >
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m.75 12 3 3m0 0 3-3m-3 3v-6m-1.5-9H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9z"/>
          </svg>
          保存
        </button>
        <div class="w-px h-4 bg-purple-800/60 mx-0.5"></div>
        <button
          id="importProjectBtn"
          title=".narapyプロジェクトを開く"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs text-amber-300 hover:text-amber-100 hover:bg-amber-500/20 transition-colors cursor-pointer"
        >
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75z"/>
          </svg>
          プロジェクトを開く
        </button>
        <button
          id="exportProjectBtn"
          title="プロジェクトを.narapyとして保存"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs text-amber-300 hover:text-amber-100 hover:bg-amber-500/20 transition-colors cursor-pointer"
        >
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 7.5h1.5m-1.5 3h1.5m-7.5 3h7.5m-7.5 3h7.5m3-9h3.375c.621 0 1.125.504 1.125 1.125V18a2.25 2.25 0 0 1-2.25 2.25M16.5 7.5V18a2.25 2.25 0 0 0 2.25 2.25M16.5 7.5V4.875c0-.621-.504-1.125-1.125-1.125H4.125C3.504 3.75 3 4.254 3 4.875V18a2.25 2.25 0 0 0 2.25 2.25h13.5M6 7.5h3v3H6v-3z"/>
          </svg>
          プロジェクトを保存
        </button>
        <button
          id="aboutBtn"
          title="オープンソースライセンス"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs text-slate-500 hover:text-slate-300 hover:bg-slate-700/40 transition-colors cursor-pointer"
        >
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
          ライセンス
        </button>
        <button
          id="runBtn"
          class="flex items-center gap-2 px-4 py-1.5 rounded-lg bg-violet-600 hover:bg-violet-500 active:bg-violet-700 text-white text-sm font-bold transition-colors shadow-md shadow-violet-900/50 cursor-pointer"
        >
          ▶ 実行
        </button>
      </div>
    </header>

    <!-- メインエリア（2カラム） -->
    <main class="flex flex-1 overflow-hidden relative">

      <!-- 全パネル非表示時のメッセージ -->
      <div id="emptyMessage" class="hidden absolute inset-0 z-10 flex-col items-center justify-center bg-[#08080d]">
        <span class="text-slate-700 text-sm select-none">何もありません</span>
      </div>

      <!-- 左カラム: Blockly ワークスペース（アクセント: sky-blue） -->
      <section id="blocklyPanel" class="flex flex-col overflow-hidden border-sky-700/50 bg-[#060d16]">
        <div id="blocklyHeader" class="flex items-center justify-between px-4 py-2.5 bg-[#0c1e30] border-b border-sky-700/50 border-l-4 border-l-sky-400 shrink-0 transition-opacity duration-200">
          <div class="flex items-center gap-2.5">
            <span id="blocklyActiveDot" class="w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse shrink-0"></span>
            <svg class="w-3.5 h-3.5 text-sky-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
            <span class="text-xs font-bold text-sky-300 uppercase tracking-widest">ブロックエディタ</span>
          </div>
          <div class="flex items-center gap-2">
          <span
            id="blocklyUnsupportedBanner"
            class="hidden text-xs px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30"
          >⚠ 未対応構文あり（編集不可）</span>
          <button
            id="hintToggleBtn"
            title="ブロックのヒント表示をオン/オフ"
            class="flex items-center gap-1 text-xs text-sky-400 hover:text-sky-200 transition-colors cursor-pointer"
          >
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636-.707.707M21 12h-1M4 12H3m1.343-5.657-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
            </svg>
            ヒント
          </button>
          </div>
        </div>
        <div class="relative flex-1 min-h-0">
          <div id="blocklyDiv" class="w-full h-full bg-[#060d16]"></div>
          <div id="blocklyOverlay" class="hidden absolute inset-0 z-10 cursor-not-allowed"></div>
        </div>
      </section>

      <!-- 右カラム: ファイルエクスプローラー + テキストエディタ + 実行ログ -->
      <section id="rightPanel" class="flex overflow-hidden min-w-0">

        <!-- ファイルエクスプローラー -->
        <aside id="fileExplorer" class="flex flex-col w-44 shrink-0 border-r border-violet-700/50 bg-[#0c0818]"></aside>

        <!-- エディタ + ログ（split.js 縦分割対象） -->
        <div class="flex flex-col flex-1 min-w-0">

          <!-- テキストエディタ（アクセント: violet） -->
          <div id="editorPanel" class="flex flex-col overflow-hidden border-b border-violet-700/50 bg-[#0c0818]">
            <div id="editorHeader" class="flex items-center justify-between px-4 py-2.5 bg-[#180a2e] border-b border-violet-700/50 border-l-4 border-l-violet-400 shrink-0 transition-opacity duration-200 opacity-50">
              <div class="flex items-center gap-2.5">
                <span id="editorActiveDot" class="w-1.5 h-1.5 rounded-full bg-slate-600 shrink-0"></span>
                <svg class="w-3.5 h-3.5 text-violet-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                  <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
                </svg>
                <span class="text-xs font-bold text-violet-300 uppercase tracking-widest">Python エディタ</span>
                <span id="editorFileName" class="text-xs text-violet-400/70 font-mono">main.py</span>
              </div>
              <span id="validationBadge" class="text-xs px-2 py-0.5 rounded-full bg-violet-900/50 text-violet-300 transition-all">
                待機中
              </span>
            </div>
            <div id="codeEditor" class="flex-1 w-full min-h-0"></div>
          </div>

          <!-- 実行ログ（アクセント: emerald） -->
          <div id="logPanel" class="flex flex-col overflow-hidden bg-[#060f0b]">
            <div class="flex items-center justify-between px-4 py-2.5 bg-[#091c12] border-b border-emerald-700/50 border-l-4 border-l-emerald-400 shrink-0">
              <div class="flex items-center gap-2.5">
                <svg class="w-3.5 h-3.5 text-emerald-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                  <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
                </svg>
                <span class="text-xs font-bold text-emerald-300 uppercase tracking-widest">実行ログ</span>
              </div>
              <button
                id="copyLogBtn"
                title="実行結果をクリップボードにコピー"
                class="flex items-center gap-1 text-xs text-emerald-600 hover:text-emerald-300 transition-colors cursor-pointer"
              >
                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
                コピー
              </button>
            </div>
            <div
              id="outputLog"
              class="flex-1 overflow-y-auto p-4 font-mono text-sm text-slate-300 bg-[#060f0b] leading-relaxed"
            >
              <span class="text-emerald-900 italic">実行結果がここに表示されます…</span>
            </div>
          </div>

        </div><!-- /エディタ + ログ -->
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atmospya — Python Learning Environment</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Google Fonts: BIZ UDPGothic (UI) + 0xProto (コード) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=0xProto:ital,wght@0,400;0,700;1,400&family=BIZ+UDPGothic:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-[#080510] text-purple-100 h-screen flex flex-col overflow-hidden font-sans">

    <!-- ヘッダー -->
    <header class="flex items-center justify-between px-6 py-3 bg-[#110826] border-b border-purple-900/50 shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-violet-500 to-purple-700 flex items-center justify-center text-white font-bold text-sm select-none shadow-lg shadow-violet-900/50">
          A
        </div>
        <span class="text-lg font-bold tracking-tight text-purple-100">Atmospya</span>
        <span class="text-xs px-2 py-0.5 rounded-full bg-violet-500/20 text-violet-300 border border-violet-500/30">
          Python Learning
        </span>
      </div>
      <button
        id="runBtn"
        class="flex items-center gap-2 px-4 py-1.5 rounded-lg bg-violet-600 hover:bg-violet-500 active:bg-violet-700 text-white text-sm font-bold transition-colors shadow-md shadow-violet-900/50"
      >
        ▶ 実行
      </button>
    </header>

    <!-- メインエリア（2カラム） -->
    <main class="flex flex-1 overflow-hidden">

      <!-- 左カラム: Blockly ワークスペース（アクセント: sky-blue） -->
      <section class="flex flex-col w-1/2 border-r border-purple-900/40">
        <div class="flex items-center gap-2.5 px-4 py-2 bg-[#0a0820] border-b border-purple-900/40 border-l-4 border-l-sky-500 shrink-0">
          <span class="w-1.5 h-1.5 rounded-full bg-sky-400 shrink-0"></span>
          <span class="text-xs font-bold text-sky-300 uppercase tracking-widest">ブロックエディタ</span>
        </div>
        <div id="blocklyDiv" class="flex-1 w-full bg-[#080510]"></div>
      </section>

      <!-- 右カラム: テキストエディタ + 実行ログ -->
      <section class="flex flex-col w-1/2">

        <!-- テキストエディタ（アクセント: violet） -->
        <div class="flex flex-col flex-1 border-b border-purple-900/40">
          <div class="flex items-center justify-between px-4 py-2 bg-[#0d0622] border-b border-purple-900/40 border-l-4 border-l-violet-500 shrink-0">
            <div class="flex items-center gap-2.5">
              <span class="w-1.5 h-1.5 rounded-full bg-violet-400 shrink-0"></span>
              <span class="text-xs font-bold text-violet-300 uppercase tracking-widest">Python エディタ</span>
            </div>
            <span id="validationBadge" class="text-xs px-2 py-0.5 rounded-full bg-purple-900/60 text-purple-400 transition-all">
              待機中
            </span>
          </div>
          <textarea
            id="codeEditor"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            class="flex-1 w-full resize-none bg-[#060410] text-purple-100 font-mono text-sm p-4 outline-none placeholder-purple-800 leading-relaxed"
            placeholder="# ここにPythonコードを入力…&#10;print('Hello, Atmospya!')"
          ></textarea>
        </div>

        <!-- 実行ログ（アクセント: emerald） -->
        <div class="flex flex-col flex-1 min-h-0">
          <div class="flex items-center justify-between px-4 py-2 bg-[#060d14] border-b border-purple-900/40 border-l-4 border-l-emerald-500 shrink-0">
            <div class="flex items-center gap-2.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 shrink-0"></span>
              <span class="text-xs font-bold text-emerald-300 uppercase tracking-widest">実行ログ</span>
            </div>
            <button
              id="clearLogBtn"
              class="text-xs text-purple-600 hover:text-purple-300 transition-colors"
            >
              クリア
            </button>
          </div>
          <div
            id="outputLog"
            class="flex-1 overflow-y-auto p-4 font-mono text-sm text-purple-200 bg-[#050310] leading-relaxed"
          >
            <span class="text-purple-800 italic">実行結果がここに表示されます…</span>
          </div>
        </div>

      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

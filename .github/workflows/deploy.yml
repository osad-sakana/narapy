name: Deploy (S3 + CloudFront)

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC でロールを引き受けるため id-token: write が必要
permissions:
  contents: read
  id-token: write

# 同期中に別のデプロイが走ると新旧ファイルが混ざるため直列にする
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # ロール ARN・バケット名・ディストリビューション ID は公開リポジトリに書かず Variables で渡す
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # assets/ はファイル名にハッシュが付くので長期キャッシュにする。
      # 古い版を参照中のタブが壊れないよう、assets/ は --delete しない
      - name: Sync hashed assets
        run: |
          aws s3 sync dist/assets "s3://${{ vars.S3_BUCKET }}/assets" \
            --cache-control "public,max-age=31536000,immutable"

      # それ以外（index.html など名前が変わらないもの）は毎回再検証させる。除外した assets/ は --delete の対象外
      - name: Sync everything else
        run: |
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" \
            --exclude "assets/*" \
            --delete \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
